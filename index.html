<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Diwali Greeting Card</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  overflow:hidden;
  display:flex; justify-content:center; align-items:center;
  font-family:'Roboto',sans-serif;
  background: linear-gradient(45deg,#ff6f61,#f9d423,#ff9a8b,#8e44ad,#3498db,#2ecc71);
  background-size: 300% 300%;
  animation:bgAnim 25s ease infinite;
  perspective:1200px;
  cursor:pointer;
}
@keyframes bgAnim{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

.container{display:flex;justify-content:center;align-items:center;width:100%;height:100%;position:relative;}
.card{
  position:relative; display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
  width:80%; max-width:900px; height:450px; 
  padding:40px; border-radius:50px;
  background: rgba(0,0,0,0.0);
  box-shadow:0 15px 60px rgba(248, 61, 161, 0.5); backdrop-filter:blur(5px); z-index:2;
  border:2px solid rgba(255,255,255,0.2);
  transform-style:preserve-3d;
}

.left{flex:1; min-width:300px; display:flex; justify-content:center; align-items:center; transform:translateZ(0); position:relative;}
.right{flex:1; min-width:300px; display:flex; flex-direction: column; justify-content:center; align-items:flex-start; padding-left:20px; transform:translateZ(0); overflow:hidden;}

h1{
  font-family:'Great Vibes',cursive;font-size:60px;margin:0 0 15px 0; 
  background:linear-gradient(90deg,#b4d639,#ff4d4d,#b13394,#57d6c3);
  background-size:400% 400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: gradientText 5s ease infinite;
  text-shadow:1px 1px 6px rgba(26, 153, 216, 0.5);
  width:100%;
  text-align:left;
}

@keyframes gradientText{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

.greeting{background: rgba(0,0,0,0.0); padding:30px;border-radius:20px;text-align:left;width:90%; transform:translateZ(10px);}
.greeting p{font-size:22px;color:#fff;margin:6px 0;}
.greeting .personal{
margin-top:18px;font-size:28px;font-family:'Great Vibes',cursive;
background: linear-gradient(90deg,#ffea00,#ff4d4d,#4c20bd,#83295f);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation: gradientText 5s ease infinite;
text-shadow:1px 1px 6px rgba(18, 214, 248, 0.4);
transform:translateZ(20px);}
.greeting .diwali-line{
font-size:24px;margin-top:15px;font-weight:bold;font-family:'Pacifico',cursive;
background: linear-gradient(90deg,#ffea00,#4da6ff,#ff4db8);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation: gradientText 5s ease infinite; text-shadow:1px 1px 5px rgba(165, 222, 232, 0.4);
transform:translateZ(15px);
}

.diya-wrap{width:380px;height:380px;position:relative; transform:translateZ(30px);}
.diya{width:240px;height:240px;position:relative;}
.pot{position:absolute; bottom:25px; left:50%; transform:translateX(-50%); width:180px; height:120px; border-radius:50% 50% 25% 25%; background:linear-gradient(180deg,#ffb84d,#ff8c00);}
.oil{width:70%; height:22px; border-radius:12px; background:linear-gradient(180deg,#ffd87a,#ffb84d); position:absolute; bottom:10px; left:50%; transform:translateX(-50%);}
.base{position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:180px; height:30px; border-radius:40px; background:linear-gradient(180deg,#3b2a1f,#2a1a0f);}

.flame{position:absolute; bottom:120px; left:50%; transform:translateX(-50%); width:60px; height:80px;}
.flame .outer,.flame .inner{position:absolute; bottom:0; left:50%; transform:translateX(-50%); border-radius:50% 50% 50% 50%/60% 60% 40% 40%;}
.flame .outer{width:60px; height:80px; background:radial-gradient(circle at 40% 20%,#fff6b2,#ffd166 40%,#ff9730 60%,transparent 70%); filter:blur(1px); opacity:0.98; animation:flameFlicker 1.1s infinite ease-in-out;}
.flame .inner{width:28px; height:50px; bottom:12px; background: linear-gradient(180deg,#fffef4,#fff1c0); opacity:0.95; animation:flameFlicker2 0.9s infinite ease-in-out;}

@keyframes flameFlicker{0%{transform:translateX(-50%) translateY(-2px) scaleY(1);}50%{transform:translateX(-50%) translateY(-6px) scaleY(1.06);}100%{transform:translateX(-50%) translateY(-2px) scaleY(1);}}
@keyframes flameFlicker2{0%{transform:translateX(-50%) translateY(0) scaleY(1);}50%{transform:translateX(-50%) translateY(-3px) scaleY(1.08);}100%{transform:translateX(-50%) translateY(0) scaleY(1);}}

.glow{position:absolute; bottom:120px; left:50%; transform:translateX(-50%); width:300px; height:150px; border-radius:50%; filter:blur(60px); background:radial-gradient(circle, rgba(255,209,102,0.6), rgba(255,123,123,0)); opacity:0.3;}

.diya-text{
  position:absolute; bottom:70px; left:50%; transform:translateX(-50%);
  font-family:'Great Vibes',cursive; font-size:30px;
  background:linear-gradient(90deg,#ffea00,#ff4d4d,#4c20bd,#83295f);
  background-size:400% 400%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  animation: gradientText 5s ease infinite;
  text-shadow:1px 1px 6px rgba(0,0,0,0.5);
}

.sparkles, .fireworks{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;}
.spark{position:absolute; width:6px; height:6px; border-radius:50%; background:white; opacity:0.9; filter:blur(0.5px); animation: floatUp 2s linear infinite;}
@keyframes floatUp{0%{transform:translate(0,0) scale(0.6) rotateY(0deg);opacity:0.2;}50%{transform:translate(var(--dx,0),-80px) scale(1.2) rotateY(180deg);opacity:1;}100%{transform:translate(var(--dx,0),-160px) scale(0.6) rotateY(360deg);opacity:0;}}

/* Mobile styles */
@media (max-width: 768px) {
  .card { flex-direction: column; padding: 20px; height: auto; }
  .left, .right { min-width: auto; justify-content: center; align-items: center; padding-left:0; }
  h1 { font-size: 30px; text-align:center; }
  .diya-wrap { width: 220px; height: 220px; }
  .diya { width: 140px; height: 140px; }
  .greeting p { font-size: 16px; text-align:center; }
  .greeting .personal { font-size: 20px; }
  .greeting .diwali-line { font-size: 18px; }
  .diya-text { font-size: 20px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="left">
      <div class="diya-wrap">
        <div class="diya">
          <div class="glow"></div>
          <div class="flame">
            <div class="outer"></div>
            <div class="inner"></div>
          </div>
          <div class="pot"><div class="oil"></div></div>
          <div class="base"></div>
          <div class="diya-text">Kavya</div>
        </div>
      </div>
    </div>
    <div class="right">
      <div class="greeting">
        <h1>Happiest Diwali</h1>
        <p class="personal">For Kanchan & her family</p>
        <p class="diwali-line">May your life be filled with light, love and endless celebrations!</p>
      </div>
    </div>
  </div>
</div>

<div class="sparkles"></div>
<div class="fireworks"></div>

<script>
// Sparkles
const sparkContainer=document.querySelector('.sparkles');
function createSpark(){const s=document.createElement('div');s.className='spark';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.setProperty('--dx',(Math.random()-0.5)*100+'px');sparkContainer.appendChild(s);setTimeout(()=>s.remove(),2500);}
setInterval(()=>{for(let i=0;i<12;i++) createSpark();},100);

// Fireworks container
const fwContainer=document.querySelector('.fireworks');

// Firework generator with glowing trail
function createFirework(x,y,type='burst'){
  let colors=[], count=50;
  switch(type){
    case 'burst': colors=['#ff4d4d','#ffd11a','#ff8c42','#ffb347','#ff5733']; count=50; break;
    case 'star': colors=['#4da6ff','#00ffff','#9933ff','#33ccff','#6699ff']; count=60; break;
    case 'fountain': colors=['#ff4d4d','#ffea00','#4da6ff','#4dff88','#ff4db8','#ff7f50']; count=40; break;
    case 'comet': colors=['#ff00ff','#00ffdd','#ff7f50','#7fff00','#ff69b4']; count=30; break;
  }

  for(let i=0;i<count;i++){
    const f=document.createElement('div');
    f.style.position='absolute';
    f.style.width='6px';
    f.style.height='6px';
    f.style.borderRadius='50%';
    f.style.background=colors[Math.floor(Math.random()*colors.length)];
    f.style.boxShadow=`0 0 10px ${f.style.background}, 0 0 20px ${f.style.background}`;
    f.style.left=x+'px';
    f.style.top=y+'px';
    f.style.opacity=1;
    fwContainer.appendChild(f);

    let dx=0, dy=0, dz=0;
    switch(type){
      case 'burst': dx=(Math.random()-0.5)*400; dy=(Math.random()-0.5)*400; dz=(Math.random()-0.5)*200; break;
      case 'star': dx=Math.cos(i*2*Math.PI/count)*200; dy=Math.sin(i*2*Math.PI/count)*200; dz=(Math.random()-0.5)*200; break;
      case 'fountain': dx=(Math.random()-0.5)*50; dy=-Math.random()*400; dz=0; break;
      case 'comet': dx=(Math.random()-0.5)*50; dy=-Math.random()*500; dz=(Math.random()-0.5)*200; break;
    }

    f.animate([
      {transform:`translate3d(0,0,0) scale(0.5) rotate(${Math.random()*360}deg)`, opacity:1},
      {transform:`translate3d(${dx}px,${dy}px,${dz}px) scale(2) rotate(${Math.random()*720}deg)`, opacity:0}
    ],{duration:1600+Math.random()*600,easing:'ease-out',fill:'forwards'});

    // Trail
    const trail=document.createElement('div');
    trail.style.position='absolute';
    trail.style.width='4px';
    trail.style.height='4px';
    trail.style.borderRadius='50%';
    trail.style.background=f.style.background;
    trail.style.boxShadow=f.style.boxShadow;
    trail.style.left=x+'px';
    trail.style.top=y+'px';
    trail.style.opacity=0.6;
    fwContainer.appendChild(trail);
    trail.animate([{transform:`translate3d(0,0,0)`, opacity:0.6},{transform:`translate3d(${dx/2}px,${dy/2}px,${dz/2}px)`, opacity:0}],{duration:800+Math.random()*400,easing:'ease-out',fill:'forwards'});
    setTimeout(()=>trail.remove(),1000);
    setTimeout(()=>f.remove(),2000);
  }
}

// Automatic fireworks
setInterval(()=>{ 
  const types=['burst','star','fountain','comet'];
  const type=types[Math.floor(Math.random()*types.length)];
  createFirework(Math.random()*window.innerWidth,Math.random()*window.innerHeight/2,type);
},1000);

// Firework on click or hover
document.body.addEventListener('click',(e)=>createFirework(e.clientX,e.clientY,'comet'));
document.body.addEventListener('mousemove',(e)=>{if(Math.random()<0.05) createFirework(e.clientX,e.clientY,'fountain');});
</script>
</body>
</html>
