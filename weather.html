<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            width: 300px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-box button {
            padding: 12px 30px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .weather-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .weather-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.25);
        }

        .city-name {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .temperature {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .weather-description {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .detail {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .weather-icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }

            .search-box input {
                width: 100%;
            }

            .weather-grid {
                grid-template-columns: 1fr;
            }

            .temperature {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="portfolio.html" class="back-link">← Back to Portfolio</a>
        
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p style="font-size: 18px; opacity: 0.9;">Get real-time weather data for any city</p>
        </div>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                onkeypress="if(event.key === 'Enter') searchWeather()"
            >
            <button onclick="searchWeather()">Search</button>
        </div>

        <div id="errorContainer"></div>
        <div id="weatherContainer" class="weather-grid"></div>
    </div>

    <script>
        const API_KEY = 'b6fd43b5a86f42f3a0a210709242512';
        const weatherContainer = document.getElementById('weatherContainer');
        const errorContainer = document.getElementById('errorContainer');

        const iconMap = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '🌙',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        function displayError(message) {
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
            weatherContainer.innerHTML = '';
        }

        function clearError() {
            errorContainer.innerHTML = '';
        }

        function getWeatherIcon(iconCode) {
            return iconMap[iconCode] || '🌤️';
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                displayError('Please enter a city name');
                return;
            }

            try {
                clearError();
                weatherContainer.innerHTML = '<div class="loading">Loading weather data...</div>';

                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
                );

                if (!response.ok) {
                    if (response.status === 404) {
                        displayError('City not found. Please try another city name.');
                    } else {
                        displayError('Error fetching weather data. Please try again.');
                    }
                    return;
                }

                const data = await response.json();
                displayWeather(data);
            } catch (error) {
                displayError('Error: Unable to fetch weather data. Please try again.');
                console.error(error);
            }
        }

        function displayWeather(data) {
            const { name } = data;
            const { temp, feels_like, humidity, pressure } = data.main;
            const { speed } = data.wind;
            const { description, icon } = data.weather[0];

            const weatherCard = document.createElement('div');
            weatherCard.className = 'weather-card';
            weatherCard.innerHTML = `
                <div class="weather-icon">${getWeatherIcon(icon)}</div>
                <div class="city-name">${name}, ${data.sys.country}</div>
                <div class="temperature">${Math.round(temp)}°C</div>
                <div class="weather-description">${description}</div>
                
                <div class="weather-details">
                    <div class="detail">
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value">${Math.round(feels_like)}°C</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value">${humidity}%</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value">${speed.toFixed(1)} m/s</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value">${pressure} hPa</div>
                    </div>
                </div>
            `;

            weatherContainer.innerHTML = '';
            weatherContainer.appendChild(weatherCard);
        }

        window.addEventListener('load', () => {
            document.getElementById('cityInput').value = 'London';
            searchWeather();
        });
    </script>
</body>
</html>
